# Pipeline de CI/CD para el backend de NEXTPROJECT.
# develop -> despliega a staging | main -> despliega a produccion.

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - backend/*

pool:
  name: 'Zyntra Agent Pool'

variables:
  - group: next-project-secrets
  - group: next-project-backend-secrets
  - name: harborRegistry
    value: 'hub.zyntra-ts.com'
  - name: harborProject
    value: 'nextproject'
  - name: imageName
    value: 'nextproject-backend'

stages:
- stage: Build
  displayName: 'Build and Push Backend Image'
  jobs:
  - job: BuildJob
    displayName: 'Docker Build & Push'
    steps:
    - script: |
        echo "$(HARBOR_PASSWORD)" | docker login $(harborRegistry) -u "$(HARBOR_USERNAME)" --password-stdin
      displayName: 'Docker Login to Harbor'

    - script: |
        docker build \
          -t $(harborRegistry)/$(harborProject)/$(imageName):$(Build.BuildId) \
          -t $(harborRegistry)/$(harborProject)/$(imageName):$(Build.SourceBranchName) \
          ./backend
      displayName: 'Docker Build'

    - script: |
        docker push $(harborRegistry)/$(harborProject)/$(imageName):$(Build.BuildId)
        docker push $(harborRegistry)/$(harborProject)/$(imageName):$(Build.SourceBranchName)
      displayName: 'Docker Push'

- stage: DeployStaging
  displayName: 'Deploy Backend to Staging'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - job: DeployStagingJob
    displayName: 'Run Staging Container'
    steps:
    - script: |
        echo "$(HARBOR_PASSWORD)" | docker login $(harborRegistry) -u "$(HARBOR_USERNAME)" --password-stdin
      displayName: 'Docker Login to Harbor'

    - script: |
        ENV_FILE="$(Agent.TempDirectory)/backend-staging.env"
        umask 077
        cat > "$ENV_FILE" <<EOF
        PORT=3000
        CORS_ORIGINS=$CORS_ORIGINS
        DB_HOST=$DB_HOST
        DB_PORT=$DB_PORT
        DB_NAME=$DB_NAME
        DB_USER=$DB_USER
        DB_PASSWORD=$DB_PASSWORD
        JWT_SECRET=$JWT_SECRET
        JWT_EXPIRES_IN=$JWT_EXPIRES_IN
        GEMINI_API_KEY=$GEMINI_API_KEY
        GEMINI_MODEL=$GEMINI_MODEL
        COTIZACION_LINK_SECRET=$COTIZACION_LINK_SECRET
        LEAD_LINK_SECRET=$LEAD_LINK_SECRET
        OPERATIVO_POR_DEFECTO_EMAIL=$OPERATIVO_POR_DEFECTO_EMAIL
        BANCO_NOMBRE=$BANCO_NOMBRE
        BANCO_TIPO_CUENTA=$BANCO_TIPO_CUENTA
        BANCO_NUMERO_CUENTA=$BANCO_NUMERO_CUENTA
        BANCO_TITULAR=$BANCO_TITULAR
        BANCO_RUC=$BANCO_RUC
        SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
        SEED_COMERCIAL_PASSWORD=$SEED_COMERCIAL_PASSWORD
        SEED_OPERATIVO_PASSWORD=$SEED_OPERATIVO_PASSWORD
        BREVO_API_KEY=$BREVO_API_KEY
        NEXT_PROJECT_EMAIL=$NEXT_PROJECT_EMAIL
        BREVO_SANDBOX=$BREVO_SANDBOX
        NEXT_PROJECT_NAME=$NEXT_PROJECT_NAME
        NEXT_PROJECT_WHATSAPP=$NEXT_PROJECT_WHATSAPP
        EOF
      displayName: 'Generate Staging .env'
      env:
        CORS_ORIGINS: $(DEV_CORS_ORIGINS)
        DB_HOST: $(DEV_DB_HOST)
        DB_PORT: $(DEV_DB_PORT)
        DB_NAME: $(DEV_DB_NAME)
        DB_USER: $(DEV_DB_USER)
        DB_PASSWORD: $(DEV_DB_PASSWORD)
        JWT_SECRET: $(DEV_JWT_SECRET)
        JWT_EXPIRES_IN: $(DEV_JWT_EXPIRES_IN)
        GEMINI_API_KEY: $(DEV_GEMINI_API_KEY)
        GEMINI_MODEL: $(DEV_GEMINI_MODEL)
        COTIZACION_LINK_SECRET: $(DEV_COTIZACION_LINK_SECRET)
        LEAD_LINK_SECRET: $(DEV_LEAD_LINK_SECRET)
        OPERATIVO_POR_DEFECTO_EMAIL: $(DEV_OPERATIVO_POR_DEFECTO_EMAIL)
        BANCO_NOMBRE: $(DEV_BANCO_NOMBRE)
        BANCO_TIPO_CUENTA: $(DEV_BANCO_TIPO_CUENTA)
        BANCO_NUMERO_CUENTA: $(DEV_BANCO_NUMERO_CUENTA)
        BANCO_TITULAR: $(DEV_BANCO_TITULAR)
        BANCO_RUC: $(DEV_BANCO_RUC)
        SEED_ADMIN_PASSWORD: $(DEV_SEED_ADMIN_PASSWORD)
        SEED_COMERCIAL_PASSWORD: $(DEV_SEED_COMERCIAL_PASSWORD)
        SEED_OPERATIVO_PASSWORD: $(DEV_SEED_OPERATIVO_PASSWORD)
        BREVO_API_KEY: $(DEV_BREVO_API_KEY)
        NEXT_PROJECT_EMAIL: $(DEV_NEXT_PROJECT_EMAIL)
        BREVO_SANDBOX: $(DEV_BREVO_SANDBOX)
        NEXT_PROJECT_NAME: $(DEV_NEXT_PROJECT_NAME)
        NEXT_PROJECT_WHATSAPP: $(DEV_NEXT_PROJECT_WHATSAPP)

    - script: |
        docker pull $(harborRegistry)/$(harborProject)/$(imageName):$(Build.BuildId)

        docker stop nextproject-backend-staging || true
        docker rm nextproject-backend-staging || true

        docker run -d \
          --name nextproject-backend-staging \
          --restart always \
          -p 5001:3000 \
          --env-file "$(Agent.TempDirectory)/backend-staging.env" \
          $(harborRegistry)/$(harborProject)/$(imageName):$(Build.BuildId)
      displayName: 'Docker Run Staging Container'

    - script: |
        rm -f "$(Agent.TempDirectory)/backend-staging.env"
      displayName: 'Cleanup Staging .env'
      condition: always()

- stage: DeployProduction
  displayName: 'Deploy Backend to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProductionJob
    displayName: 'Run Production Container'
    environment: 'nextproject-backend-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "$(HARBOR_PASSWORD)" | docker login $(harborRegistry) -u "$(HARBOR_USERNAME)" --password-stdin
            displayName: 'Docker Login to Harbor'

          - script: |
              ENV_FILE="$(Agent.TempDirectory)/backend-production.env"
              umask 077
              cat > "$ENV_FILE" <<EOF
              PORT=3000
              CORS_ORIGINS=$CORS_ORIGINS
              DB_HOST=$DB_HOST
              DB_PORT=$DB_PORT
              DB_NAME=$DB_NAME
              DB_USER=$DB_USER
              DB_PASSWORD=$DB_PASSWORD
              JWT_SECRET=$JWT_SECRET
              JWT_EXPIRES_IN=$JWT_EXPIRES_IN
              GEMINI_API_KEY=$GEMINI_API_KEY
              GEMINI_MODEL=$GEMINI_MODEL
              COTIZACION_LINK_SECRET=$COTIZACION_LINK_SECRET
              LEAD_LINK_SECRET=$LEAD_LINK_SECRET
              OPERATIVO_POR_DEFECTO_EMAIL=$OPERATIVO_POR_DEFECTO_EMAIL
              BANCO_NOMBRE=$BANCO_NOMBRE
              BANCO_TIPO_CUENTA=$BANCO_TIPO_CUENTA
              BANCO_NUMERO_CUENTA=$BANCO_NUMERO_CUENTA
              BANCO_TITULAR=$BANCO_TITULAR
              BANCO_RUC=$BANCO_RUC
              SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
              SEED_COMERCIAL_PASSWORD=$SEED_COMERCIAL_PASSWORD
              SEED_OPERATIVO_PASSWORD=$SEED_OPERATIVO_PASSWORD
              BREVO_API_KEY=$BREVO_API_KEY
              NEXT_PROJECT_EMAIL=$NEXT_PROJECT_EMAIL
              BREVO_SANDBOX=$BREVO_SANDBOX
              NEXT_PROJECT_NAME=$NEXT_PROJECT_NAME
              NEXT_PROJECT_WHATSAPP=$NEXT_PROJECT_WHATSAPP
              EOF
            displayName: 'Generate Production .env'
            env:
              CORS_ORIGINS: $(PROD_CORS_ORIGINS)
              DB_HOST: $(PROD_DB_HOST)
              DB_PORT: $(PROD_DB_PORT)
              DB_NAME: $(PROD_DB_NAME)
              DB_USER: $(PROD_DB_USER)
              DB_PASSWORD: $(PROD_DB_PASSWORD)
              JWT_SECRET: $(PROD_JWT_SECRET)
              JWT_EXPIRES_IN: $(PROD_JWT_EXPIRES_IN)
              GEMINI_API_KEY: $(PROD_GEMINI_API_KEY)
              GEMINI_MODEL: $(PROD_GEMINI_MODEL)
              COTIZACION_LINK_SECRET: $(PROD_COTIZACION_LINK_SECRET)
              LEAD_LINK_SECRET: $(PROD_LEAD_LINK_SECRET)
              OPERATIVO_POR_DEFECTO_EMAIL: $(PROD_OPERATIVO_POR_DEFECTO_EMAIL)
              BANCO_NOMBRE: $(PROD_BANCO_NOMBRE)
              BANCO_TIPO_CUENTA: $(PROD_BANCO_TIPO_CUENTA)
              BANCO_NUMERO_CUENTA: $(PROD_BANCO_NUMERO_CUENTA)
              BANCO_TITULAR: $(PROD_BANCO_TITULAR)
              BANCO_RUC: $(PROD_BANCO_RUC)
              SEED_ADMIN_PASSWORD: $(PROD_SEED_ADMIN_PASSWORD)
              SEED_COMERCIAL_PASSWORD: $(PROD_SEED_COMERCIAL_PASSWORD)
              SEED_OPERATIVO_PASSWORD: $(PROD_SEED_OPERATIVO_PASSWORD)
              BREVO_API_KEY: $(PROD_BREVO_API_KEY)
              NEXT_PROJECT_EMAIL: $(PROD_NEXT_PROJECT_EMAIL)
              BREVO_SANDBOX: $(PROD_BREVO_SANDBOX)
              NEXT_PROJECT_NAME: $(PROD_NEXT_PROJECT_NAME)
              NEXT_PROJECT_WHATSAPP: $(PROD_NEXT_PROJECT_WHATSAPP)

          - script: |
              docker pull $(harborRegistry)/$(harborProject)/$(imageName):$(Build.BuildId)

              docker stop nextproject-backend-prod || true
              docker rm nextproject-backend-prod || true

              docker run -d \
                --name nextproject-backend-prod \
                --restart always \
                -p 5000:3000 \
                --env-file "$(Agent.TempDirectory)/backend-production.env" \
                $(harborRegistry)/$(harborProject)/$(imageName):$(Build.BuildId)
            displayName: 'Docker Run Production Container'

          - script: |
              rm -f "$(Agent.TempDirectory)/backend-production.env"
            displayName: 'Cleanup Production .env'
            condition: always()
