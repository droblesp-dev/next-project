# Pipeline de CI/CD unico para NEXTPROJECT (backend + frontend).
# develop -> despliega a staging | main -> despliega a produccion.
#

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - backend/*
      - frontend/*
      - azure-pipelines.yml

# Cada ambiente tiene su propio pool de agentes: main -> produccion, resto -> desarrollo.
pool:
  name: ${{ variables.agentPool }}

variables:
  - group: next-project-secrets
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    - name: agentPool
      value: "Zyntra Agent Pool"
  - ${{ else }}:
    - name: agentPool
      value: "Zyntra Agent Pool Develop"
  - name: harborProject
    value: "zyntra"
  - name: backendImageName
    value: "nextproject-backend"
  - name: frontendImageName
    value: "nextproject-frontend"
  - name: backendDevHostPort
    value: "5000"
  - name: backendProdHostPort
    value: "5000"
  - name: frontendDevHostPort
    value: "4000"
  - name: frontendProdHostPort
    value: "4000"
  - name: dbSsl
    value: "true"
  - name: nextProjectName
    value: "NextProject"
  - name: nextProjectWhatsapp
    value: "593939067666"

stages:
  # Pruebas UNITARIAS de backend y frontend. No usan PostgreSQL ni ningun servicio
  # externo (las pruebas de integracion que escriben en la BD no se ejecutan en el
  # pipeline). Si alguna falla, no se construye ni se despliega nada.
  - stage: UnitTests
    displayName: "Unit Tests"
    jobs:
      - job: BackendUnitTests
        displayName: "Backend: unit tests"
        steps:
          - script: |
              set -e
              docker run --rm \
                --user "$(id -u):$(id -g)" \
                -e HOME=/tmp \
                -e CI=true \
                -e JWT_SECRET=ci-unit-tests-only \
                -e COTIZACION_LINK_SECRET=ci-unit-tests-only \
                -e LEAD_LINK_SECRET=ci-unit-tests-only \
                -v $(Build.SourcesDirectory)/backend:/app \
                -w /app \
                node:20-alpine \
                sh -c "npm ci && npx tsc --noEmit && npm test"
            displayName: "Backend: typecheck + unit tests"

      - job: FrontendUnitTests
        displayName: "Frontend: unit tests"
        steps:
          - script: |
              set -e
              docker run --rm \
                --user "$(id -u):$(id -g)" \
                -e HOME=/tmp \
                -e CI=true \
                -v $(Build.SourcesDirectory)/frontend:/app \
                -w /app \
                node:20-alpine \
                sh -c "npm ci && npm run lint && npm test"
            displayName: "Frontend: typecheck + unit tests"

  - stage: Build
    displayName: "Build and Push Images"
    dependsOn: UnitTests
    condition: succeeded()
    jobs:
      - job: BuildBackendJob
        displayName: "Backend: Docker Build & Push"
        steps:
          - script: |
              echo '$(HARBOR_PASSWORD)' | docker login $(HARBOR_REGISTRY) -u '$(HARBOR_USERNAME)' --password-stdin
            displayName: "Docker Login to Harbor"

          - script: |
              docker build \
                -t $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.BuildId) \
                -t $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.SourceBranchName) \
                ./backend
            displayName: "Docker Build"

          - script: |
              docker push $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.BuildId)
              docker push $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.SourceBranchName)
            displayName: "Docker Push"

      - job: BuildFrontendJob
        displayName: "Frontend: Docker Build & Push"
        steps:
          - script: |
              echo '$(HARBOR_PASSWORD)' | docker login $(HARBOR_REGISTRY) -u '$(HARBOR_USERNAME)' --password-stdin
            displayName: "Docker Login to Harbor"

          - script: |
              docker build \
                --build-arg VITE_API_BASE_URL= \
                --build-arg VITE_NEXT_PROJECT_NAME="$(nextProjectName)" \
                --build-arg VITE_NEXT_PROJECT_WHATSAPP="$(nextProjectWhatsapp)" \
                -t $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.BuildId) \
                -t $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.SourceBranchName) \
                ./frontend
            displayName: "Docker Build"

          - script: |
              docker push $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.BuildId)
              docker push $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.SourceBranchName)
            displayName: "Docker Push"

  - stage: RunMigrations
    displayName: "Run Database Migrations"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: MigrateDevJob
        displayName: "Apply Migrations (dev)"
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
        steps:
        - script: |
            set -e
            cat > "$(Agent.TempDirectory)/migrate.sh" <<'SCRIPT'
            set -e
            psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT now());"
            for f in $(ls /migrations/*.sql | sed -E 's|.*/V([0-9]+)__.*|\1 &|' | sort -n | cut -d' ' -f2); do
              version=$(basename "$f")
              applied=$(psql -tAc "SELECT 1 FROM schema_migrations WHERE version = '$version'")
              if [ "$applied" = "1" ]; then
                echo "Skip $version (ya aplicada)"
              else
                echo "Aplicando $version"
                psql -v ON_ERROR_STOP=1 -f "/migrations/$version"
                psql -c "INSERT INTO schema_migrations(version) VALUES ('$version')"
              fi
            done
            SCRIPT

            docker run --rm \
              -e PGHOST="$DB_HOST" \
              -e PGPORT="$DB_PORT" \
              -e PGUSER="$DB_USER" \
              -e PGPASSWORD="$DB_PASSWORD" \
              -e PGDATABASE="$DB_NAME" \
              -e PGSSLMODE=require \
              -v $(Build.SourcesDirectory)/backend/database/migrations:/migrations:ro \
              -v "$(Agent.TempDirectory)/migrate.sh:/migrate.sh:ro" \
              postgres:18-alpine \
              sh /migrate.sh
          displayName: "Apply pending SQL migrations"
          env:
            DB_HOST: $(DEV_DB_HOST)
            DB_PORT: $(DEV_DB_PORT)
            DB_USER: $(DEV_DB_USER)
            DB_PASSWORD: $(DEV_DB_PASSWORD)
            DB_NAME: $(DEV_DB_NAME)

        - script: |
            set -e
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e DB_HOST="$DB_HOST" \
              -e DB_PORT="$DB_PORT" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_NAME="$DB_NAME" \
              -e DB_SSL="$DB_SSL" \
              -e SEED_ADMIN_EMAIL="$SEED_ADMIN_EMAIL" \
              -e SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
              -e SEED_COMERCIAL_EMAIL="$SEED_COMERCIAL_EMAIL" \
              -e SEED_COMERCIAL_PASSWORD="$SEED_COMERCIAL_PASSWORD" \
              -e SEED_OPERATIVO_EMAIL="$SEED_OPERATIVO_EMAIL" \
              -e SEED_OPERATIVO_PASSWORD="$SEED_OPERATIVO_PASSWORD" \
              -v $(Build.SourcesDirectory)/backend:/app \
              -w /app \
              node:20-alpine \
              sh -c "npm ci --omit=dev && node scripts/seed-usuarios-roles.js && node scripts/seed-bancos-catalogo.js"
          displayName: "Seed initial users per role and banks catalog"
          env:
            DB_HOST: $(DEV_DB_HOST)
            DB_PORT: $(DEV_DB_PORT)
            DB_USER: $(DEV_DB_USER)
            DB_PASSWORD: $(DEV_DB_PASSWORD)
            DB_NAME: $(DEV_DB_NAME)
            DB_SSL: $(dbSsl)
            SEED_ADMIN_EMAIL: $(DEV_SEED_ADMIN_EMAIL)
            SEED_ADMIN_PASSWORD: $(DEV_SEED_ADMIN_PASSWORD)
            SEED_COMERCIAL_EMAIL: $(DEV_SEED_COMERCIAL_EMAIL)
            SEED_COMERCIAL_PASSWORD: $(DEV_SEED_COMERCIAL_PASSWORD)
            SEED_OPERATIVO_EMAIL: $(DEV_OPERATIVO_POR_DEFECTO_EMAIL)
            SEED_OPERATIVO_PASSWORD: $(DEV_SEED_OPERATIVO_PASSWORD)

      - job: MigrateProdJob
        displayName: "Apply Migrations (prod)"
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
        steps:
        - script: |
            set -e
            cat > "$(Agent.TempDirectory)/migrate.sh" <<'SCRIPT'
            set -e
            psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT now());"
            for f in $(ls /migrations/*.sql | sed -E 's|.*/V([0-9]+)__.*|\1 &|' | sort -n | cut -d' ' -f2); do
              version=$(basename "$f")
              applied=$(psql -tAc "SELECT 1 FROM schema_migrations WHERE version = '$version'")
              if [ "$applied" = "1" ]; then
                echo "Skip $version (ya aplicada)"
              else
                echo "Aplicando $version"
                psql -v ON_ERROR_STOP=1 -f "/migrations/$version"
                psql -c "INSERT INTO schema_migrations(version) VALUES ('$version')"
              fi
            done
            SCRIPT

            docker run --rm \
              -e PGHOST="$DB_HOST" \
              -e PGPORT="$DB_PORT" \
              -e PGUSER="$DB_USER" \
              -e PGPASSWORD="$DB_PASSWORD" \
              -e PGDATABASE="$DB_NAME" \
              -e PGSSLMODE=require \
              -v $(Build.SourcesDirectory)/backend/database/migrations:/migrations:ro \
              -v "$(Agent.TempDirectory)/migrate.sh:/migrate.sh:ro" \
              postgres:18-alpine \
              sh /migrate.sh
          displayName: "Apply pending SQL migrations"
          env:
            DB_HOST: $(PROD_DB_HOST)
            DB_PORT: $(PROD_DB_PORT)
            DB_USER: $(PROD_DB_USER)
            DB_PASSWORD: $(PROD_DB_PASSWORD)
            DB_NAME: $(PROD_DB_NAME)

        - script: |
            set -e
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e DB_HOST="$DB_HOST" \
              -e DB_PORT="$DB_PORT" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_NAME="$DB_NAME" \
              -e DB_SSL="$DB_SSL" \
              -e SEED_ADMIN_EMAIL="$SEED_ADMIN_EMAIL" \
              -e SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
              -e SEED_COMERCIAL_EMAIL="$SEED_COMERCIAL_EMAIL" \
              -e SEED_COMERCIAL_PASSWORD="$SEED_COMERCIAL_PASSWORD" \
              -e SEED_OPERATIVO_EMAIL="$SEED_OPERATIVO_EMAIL" \
              -e SEED_OPERATIVO_PASSWORD="$SEED_OPERATIVO_PASSWORD" \
              -v $(Build.SourcesDirectory)/backend:/app \
              -w /app \
              node:20-alpine \
              sh -c "npm ci --omit=dev && node scripts/seed-usuarios-roles.js && node scripts/seed-bancos-catalogo.js"
          displayName: "Seed initial users per role and banks catalog"
          env:
            DB_HOST: $(PROD_DB_HOST)
            DB_PORT: $(PROD_DB_PORT)
            DB_USER: $(PROD_DB_USER)
            DB_PASSWORD: $(PROD_DB_PASSWORD)
            DB_NAME: $(PROD_DB_NAME)
            DB_SSL: $(dbSsl)
            SEED_ADMIN_EMAIL: $(PROD_SEED_ADMIN_EMAIL)
            SEED_ADMIN_PASSWORD: $(PROD_SEED_ADMIN_PASSWORD)
            SEED_COMERCIAL_EMAIL: $(PROD_SEED_COMERCIAL_EMAIL)
            SEED_COMERCIAL_PASSWORD: $(PROD_SEED_COMERCIAL_PASSWORD)
            SEED_OPERATIVO_EMAIL: $(PROD_OPERATIVO_POR_DEFECTO_EMAIL)
            SEED_OPERATIVO_PASSWORD: $(PROD_SEED_OPERATIVO_PASSWORD)

  - stage: DeployStaging
    displayName: "Deploy to Staging"
    dependsOn: RunMigrations
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployBackendStagingJob
        displayName: "Backend: Deploy to Dev Server via SSH"
        environment: "development"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: "Deploy Staging Backend Container (remote)"
                  inputs:
                    sshEndpoint: "deploy-ssh-dev"
                    runOptions: "inline"
                    inline: |
                      set -e
                      ENV_FILE="$HOME/backend-staging.env"
                      umask 077
                      cat > "$ENV_FILE" <<EOF
                      PORT=3000
                      CORS_ORIGINS=$(DEV_CORS_ORIGINS)
                      DB_HOST=$(DEV_DB_HOST)
                      DB_PORT=$(DEV_DB_PORT)
                      DB_NAME=$(DEV_DB_NAME)
                      DB_USER=$(DEV_DB_USER)
                      DB_PASSWORD=$(DEV_DB_PASSWORD)
                      DB_SSL=$(dbSsl)
                      TRUST_PROXY=1
                      JWT_SECRET=$(DEV_JWT_SECRET)
                      JWT_EXPIRES_IN=$(DEV_JWT_EXPIRES_IN)
                      GEMINI_API_KEY=$(DEV_GEMINI_API_KEY)
                      GEMINI_MODEL=$(DEV_GEMINI_MODEL)
                      COTIZACION_LINK_SECRET=$(DEV_COTIZACION_LINK_SECRET)
                      LEAD_LINK_SECRET=$(DEV_LEAD_LINK_SECRET)
                      OPERATIVO_POR_DEFECTO_EMAIL=$(DEV_OPERATIVO_POR_DEFECTO_EMAIL)
                      BREVO_API_KEY=$(DEV_BREVO_API_KEY)
                      NEXT_PROJECT_EMAIL=$(DEV_NEXT_PROJECT_EMAIL)
                      BREVO_SANDBOX=$(DEV_BREVO_SANDBOX)
                      NEXT_PROJECT_NAME=$(DEV_NEXT_PROJECT_NAME)
                      NEXT_PROJECT_WHATSAPP=$(DEV_NEXT_PROJECT_WHATSAPP)
                      EOF

                      echo '$(HARBOR_PASSWORD)' | docker login $(HARBOR_REGISTRY) -u '$(HARBOR_USERNAME)' --password-stdin
                      docker pull $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.BuildId)

                      docker stop nextproject-backend-staging 2>/dev/null || true
                      docker rm nextproject-backend-staging 2>/dev/null || true

                      mkdir -p "$HOME/nextproject-uploads-staging/comprobantes" "$HOME/nextproject-uploads-staging/evidencias" "$HOME/nextproject-uploads-staging/logos-bancos"

                      docker network create nextproject-net 2>/dev/null || true

                      docker run -d \
                        --name nextproject-backend-staging \
                        --restart always \
                        --network nextproject-net \
                        -p $(backendDevHostPort):3000 \
                        -v "$HOME/nextproject-uploads-staging:/app/uploads" \
                        --env-file "$ENV_FILE" \
                        $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.BuildId)

                      rm -f "$ENV_FILE"

                      echo "Esperando a que /api/health responda..."
                      for i in $(seq 1 10); do
                        if curl -sf "http://localhost:$(backendDevHostPort)/api/health" > /dev/null; then
                          echo "Health check OK"
                          exit 0
                        fi
                        echo "Intento $i/10 fallido, reintentando en 3s..."
                        sleep 3
                      done

                      echo "El contenedor no respondio en /api/health tras 10 intentos"
                      docker logs nextproject-backend-staging --tail 100
                      exit 1

      - deployment: DeployFrontendStagingJob
        displayName: "Frontend: Deploy to Dev Server via SSH"
        dependsOn: DeployBackendStagingJob
        environment: "development"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: "Deploy Staging Frontend Container (remote)"
                  inputs:
                    sshEndpoint: "deploy-ssh-dev"
                    runOptions: "inline"
                    inline: |
                      set -e

                      echo '$(HARBOR_PASSWORD)' | docker login $(HARBOR_REGISTRY) -u '$(HARBOR_USERNAME)' --password-stdin
                      docker pull $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.BuildId)

                      docker stop nextproject-frontend-staging 2>/dev/null || true
                      docker rm nextproject-frontend-staging 2>/dev/null || true

                      docker network create nextproject-net 2>/dev/null || true

                      docker run -d \
                        --name nextproject-frontend-staging \
                        --restart always \
                        --network nextproject-net \
                        -p $(frontendDevHostPort):80 \
                        -e BACKEND_HOST=nextproject-backend-staging \
                        -e BACKEND_PORT=3000 \
                        $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.BuildId)

                      echo "Esperando a que el frontend responda..."
                      for i in $(seq 1 10); do
                        if curl -sf "http://localhost:$(frontendDevHostPort)/" > /dev/null; then
                          echo "Health check OK"
                          exit 0
                        fi
                        echo "Intento $i/10 fallido, reintentando en 3s..."
                        sleep 3
                      done

                      echo "El contenedor no respondio tras 10 intentos"
                      docker logs nextproject-frontend-staging --tail 100
                      exit 1

  - stage: DeployProduction
    displayName: "Deploy to Production"
    dependsOn: RunMigrations
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployBackendProductionJob
        displayName: "Backend: Deploy to Prod Server via SSH"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: "Deploy Production Backend Container (remote)"
                  inputs:
                    sshEndpoint: "deploy-ssh-prod"
                    runOptions: "inline"
                    inline: |
                      set -e
                      ENV_FILE="$HOME/backend-production.env"
                      umask 077
                      cat > "$ENV_FILE" <<EOF
                      PORT=3000
                      CORS_ORIGINS=$(PROD_CORS_ORIGINS)
                      DB_HOST=$(PROD_DB_HOST)
                      DB_PORT=$(PROD_DB_PORT)
                      DB_NAME=$(PROD_DB_NAME)
                      DB_USER=$(PROD_DB_USER)
                      DB_PASSWORD=$(PROD_DB_PASSWORD)
                      DB_SSL=$(dbSsl)
                      TRUST_PROXY=1
                      JWT_SECRET=$(PROD_JWT_SECRET)
                      JWT_EXPIRES_IN=$(PROD_JWT_EXPIRES_IN)
                      GEMINI_API_KEY=$(PROD_GEMINI_API_KEY)
                      GEMINI_MODEL=$(PROD_GEMINI_MODEL)
                      COTIZACION_LINK_SECRET=$(PROD_COTIZACION_LINK_SECRET)
                      LEAD_LINK_SECRET=$(PROD_LEAD_LINK_SECRET)
                      OPERATIVO_POR_DEFECTO_EMAIL=$(PROD_OPERATIVO_POR_DEFECTO_EMAIL)
                      BREVO_API_KEY=$(PROD_BREVO_API_KEY)
                      NEXT_PROJECT_EMAIL=$(PROD_NEXT_PROJECT_EMAIL)
                      BREVO_SANDBOX=$(PROD_BREVO_SANDBOX)
                      NEXT_PROJECT_NAME=$(PROD_NEXT_PROJECT_NAME)
                      NEXT_PROJECT_WHATSAPP=$(PROD_NEXT_PROJECT_WHATSAPP)
                      EOF

                      echo '$(HARBOR_PASSWORD)' | docker login $(HARBOR_REGISTRY) -u '$(HARBOR_USERNAME)' --password-stdin
                      docker pull $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.BuildId)

                      docker stop nextproject-backend-prod 2>/dev/null || true
                      docker rm nextproject-backend-prod 2>/dev/null || true

                      mkdir -p "$HOME/nextproject-uploads-production/comprobantes" "$HOME/nextproject-uploads-production/evidencias" "$HOME/nextproject-uploads-production/logos-bancos"

                      docker network create nextproject-net 2>/dev/null || true

                      docker run -d \
                        --name nextproject-backend-prod \
                        --restart always \
                        --network nextproject-net \
                        -p $(backendProdHostPort):3000 \
                        -v "$HOME/nextproject-uploads-production:/app/uploads" \
                        --env-file "$ENV_FILE" \
                        $(HARBOR_REGISTRY)/$(harborProject)/$(backendImageName):$(Build.BuildId)

                      rm -f "$ENV_FILE"

                      echo "Esperando a que /api/health responda..."
                      for i in $(seq 1 10); do
                        if curl -sf "http://localhost:$(backendProdHostPort)/api/health" > /dev/null; then
                          echo "Health check OK"
                          exit 0
                        fi
                        echo "Intento $i/10 fallido, reintentando en 3s..."
                        sleep 3
                      done

                      echo "El contenedor no respondio en /api/health tras 10 intentos"
                      docker logs nextproject-backend-prod --tail 100
                      exit 1

      - deployment: DeployFrontendProductionJob
        displayName: "Frontend: Deploy to Prod Server via SSH"
        dependsOn: DeployBackendProductionJob
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: "Deploy Production Frontend Container (remote)"
                  inputs:
                    sshEndpoint: "deploy-ssh-prod"
                    runOptions: "inline"
                    inline: |
                      set -e

                      echo '$(HARBOR_PASSWORD)' | docker login $(HARBOR_REGISTRY) -u '$(HARBOR_USERNAME)' --password-stdin
                      docker pull $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.BuildId)

                      docker stop nextproject-frontend-prod 2>/dev/null || true
                      docker rm nextproject-frontend-prod 2>/dev/null || true

                      docker network create nextproject-net 2>/dev/null || true

                      docker run -d \
                        --name nextproject-frontend-prod \
                        --restart always \
                        --network nextproject-net \
                        -p $(frontendProdHostPort):80 \
                        -e BACKEND_HOST=nextproject-backend-prod \
                        -e BACKEND_PORT=3000 \
                        $(HARBOR_REGISTRY)/$(harborProject)/$(frontendImageName):$(Build.BuildId)

                      echo "Esperando a que el frontend responda..."
                      for i in $(seq 1 10); do
                        if curl -sf "http://localhost:$(frontendProdHostPort)/" > /dev/null; then
                          echo "Health check OK"
                          exit 0
                        fi
                        echo "Intento $i/10 fallido, reintentando en 3s..."
                        sleep 3
                      done

                      echo "El contenedor no respondio tras 10 intentos"
                      docker logs nextproject-frontend-prod --tail 100
                      exit 1
